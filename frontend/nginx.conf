server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    server_tokens off;
    client_max_body_size 6m;   # photos de feuilles (diagnostic) : 5 Mo + marge

    # En-têtes de sécurité : aucun script inline ni externe, connexions limitées à la même origine
    add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' https://fonts.googleapis.com; font-src https://fonts.gstatic.com; img-src 'self' data: blob:; connect-src 'self'; frame-ancestors 'none'; base-uri 'self'; form-action 'self'" always;
    add_header X-Content-Type-Options nosniff always;
    add_header Referrer-Policy no-referrer always;

    # Flux temps réel (SSE) : pas de mise en tampon, connexion longue.
    # Le jeton passe dans l'URL (EventSource) : ces requêtes ne sont donc pas journalisées.
    location ~ ^/api/v1/parcelles/\d+/evenements$ {
        proxy_pass http://api:8000;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_buffering off;
        proxy_cache off;
        proxy_read_timeout 1h;
        access_log off;
    }

    location /api/ {
        proxy_pass http://api:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location ~ ^/(docs|openapi\.json)$ {
        proxy_pass http://api:8000;
    }

    location / {
        expires -1;   # revalidation à chaque chargement (ETag) : une nouvelle version est prise immédiatement
        try_files $uri $uri/ /index.html;
    }
}
