# Plateforme Jaden Konekté : docker compose up -d --build
# Les secrets sont lus dans le fichier .env (modèle : .env.exemple).
name: jaden-konekte

services:
  # Broker MQTT avec authentification et droits par compte
  mqtt:
    image: eclipse-mosquitto:2
    entrypoint: ["/bin/sh", "/mosquitto/config/entrypoint.sh"]
    environment:
      MQTT_APP_MOT_DE_PASSE: ${MQTT_APP_MOT_DE_PASSE:?définir dans .env}
      MQTT_SIMULATEUR_MOT_DE_PASSE: ${MQTT_SIMULATEUR_MOT_DE_PASSE:?définir dans .env}
    ports:
      - "1883:1883"
    volumes:
      - ./infra/mosquitto/mosquitto.conf:/mosquitto/config/mosquitto.conf:ro
      - ./infra/mosquitto/acl:/mosquitto/config/acl:ro
      - ./infra/mosquitto/entrypoint.sh:/mosquitto/config/entrypoint.sh:ro
      - mqtt-data:/mosquitto/data
    networks: [iot]
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "mosquitto_sub -h localhost -u app -P \"$$MQTT_APP_MOT_DE_PASSE\" -t '$$SYS/broker/uptime' -C 1 -W 3 > /dev/null"]
      interval: 10s
      timeout: 5s
      retries: 5

  # PostgreSQL 16 avec TimescaleDB et pgvector
  db:
    image: timescale/timescaledb-ha:pg16
    environment:
      POSTGRES_USER: ${POSTGRES_USER:?définir dans .env}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?définir dans .env}
      POSTGRES_DB: ${POSTGRES_DB:?définir dans .env}
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - ./infra/sql/schema.sql:/docker-entrypoint-initdb.d/01-schema.sql:ro
      - db-data:/home/postgres/pgdata/data
    networks: [donnees]
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 20

  # Application : API REST, ingestion MQTT, règles d'arrosage, assistant et interface web
  app:
    build:
      context: .
      dockerfile: app/Dockerfile
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB}
      JWT_SECRET: ${JWT_SECRET:?définir dans .env}
      ADMIN_COURRIEL: ${ADMIN_COURRIEL:-}
      ADMIN_MOT_DE_PASSE: ${ADMIN_MOT_DE_PASSE:-}
      DEMO_INITIALISER: ${DEMO_INITIALISER:-true}
      MQTT_HOTE: mqtt
      MQTT_UTILISATEUR: app
      MQTT_MOT_DE_PASSE: ${MQTT_APP_MOT_DE_PASSE}
      IA_URL: http://ia:8000
      GROQ_API_KEY: ${GROQ_API_KEY:-}
      GROQ_MODELE: ${GROQ_MODELE:-openai/gpt-oss-120b}
      RESEAU_CENTRAL_URL: ${RESEAU_CENTRAL_URL:-}
      RESEAU_GROUPE: ${RESEAU_GROUPE:-jaden-konekte}
      RESEAU_NOM: ${RESEAU_NOM:-Jaden Konekté}
      RESEAU_URL_BASE: ${RESEAU_URL_BASE:-http://app:8000}
      RESEAU_SECRET: ${RESEAU_SECRET:-}
    ports:
      - "8080:8000"
    volumes:
      - diagnostics-data:/donnees/diagnostics
    depends_on:
      db: { condition: service_healthy }
      mqtt: { condition: service_healthy }
    networks: [iot, donnees, ia]
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/api/v1/sante', timeout=3)"]
      interval: 10s
      timeout: 5s
      retries: 5

  # Service d'inférence séparé : diagnostic des feuilles (CNN) et embeddings, avec ONNX Runtime
  ia:
    build: ./service-ia
    environment:
      MODELE_DOSSIER: /modeles
      EMBEDDINGS_DOSSIER: /embeddings
    volumes:
      - ./ia/cnn:/modeles:ro
    networks: [ia]
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/sante', timeout=3)"]
      interval: 15s
      timeout: 5s
      retries: 5

  # Simulateur de capteurs : les mesures de l'exploitation expl-1 sont simulées
  simulateur:
    build: ./simulateur
    # Enveloppe qui relance le simulateur après une mise en veille du PC (sinon ses mesures prennent du retard)
    command: ["python", "/enveloppe/relance_apres_veille.py", "--broker", "mqtt",
              "--user", "simulateur", "--password", "${MQTT_SIMULATEUR_MOT_DE_PASSE}",
              "--exploitation", "expl-1", "--parcelles", "p1", "p2", "p3",
              "--acceleration", "1", "--periode", "10"]
    environment:
      PYTHONUNBUFFERED: "1"
    volumes:
      - ./infra/simulateur/relance_apres_veille.py:/enveloppe/relance_apres_veille.py:ro
    depends_on:
      mqtt: { condition: service_healthy }
    networks: [iot]
    restart: unless-stopped

  # Serveur central du réseau régional, pour les essais en local (profil « reseau »)
  serveur-central:
    build: ./serveur-central
    ports:
      - "8081:8080"
    volumes:
      - central-data:/data
    networks: [ia]
    profiles: ["reseau"]
    restart: unless-stopped

networks:
  iot:        # objets et broker MQTT
  donnees:    # base de données, inaccessible aux objets
  ia:         # application, service d'inférence, serveur central

volumes:
  mqtt-data:
  db-data:
  diagnostics-data:
  central-data:
