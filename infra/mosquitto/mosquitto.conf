# Configuration SÉCURISÉE : connexions anonymes refusées, droits par compte (ACL).
# Les comptes sont créés au démarrage par entrypoint.sh à partir des variables du fichier .env.
persistence true
persistence_location /mosquitto/data/
log_dest stdout
log_type error
log_type warning
log_type notice

listener 1883
protocol mqtt

allow_anonymous false
password_file /mosquitto/data/passwd
acl_file /mosquitto/data/acl
